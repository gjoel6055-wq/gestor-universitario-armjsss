openapi: 3.0.3
info:
  title: API Gestor Universitario (IDS)
  version: 1.0.0
  description: |
    API unificada para la gestión universitaria. Documentación detallada de los endpoints requeridos, esquemas JSON y responsabilidades por feature de acuerdo a la estructura del repositorio.

    ### Distribución de Ramas y Responsables:
    * **Rafael:** `feature/db-conexion` (Infra DB), `feature/crud-alumnos`, `feature/dashboard-stats`
    * **Joel:** `feature/auth-login`, `feature/seguridad-sesiones`, `feature/asistencia-qr`
    * **Sophia:** `feature/crud-docentes`, `feature/crud-materiales`
    * **Shirley:** `feature/crud-cursos`, `feature/crud-equipos`
    * **B:** `feature/crud-evaluaciones`, `feature/crud-tipos-eval`
    * **F:** `feature/crud-notas`, `feature/pdf-reportes`
    * **E:** `feature/mail-service`, `feature/log-actividad`

servers:
  - url: http://localhost:3000/api/v1
    description: Servidor de Desarrollo Local

tags:
  - name: Autenticación
    description: "Endpoints para login y registro. **(Responsable: Joel - feature/auth-login)**"
  - name: Sesiones
    description: "Gestión de seguridad y sesiones activas. **(Responsable: Joel - feature/seguridad-sesiones)**"
  - name: Alumnos
    description: "Operaciones CRUD para Alumnos. **(Responsable: Rafael - feature/crud-alumnos)**"
  - name: Docentes
    description: "Operaciones CRUD para Docentes. **(Responsable: Sophia - feature/crud-docentes)**"
  - name: Cursos
    description: "Operaciones CRUD para Cursos. **(Responsable: Shirley - feature/crud-cursos)**"
  - name: Evaluaciones
    description: "Operaciones CRUD para Evaluaciones. **(Responsable: B - feature/crud-evaluaciones)**"
  - name: Tipos Evaluación
    description: "Operaciones CRUD para Tipos de Evaluación. **(Responsable: B - feature/crud-tipos-eval)**"
  - name: Equipos
    description: "Operaciones CRUD para Equipos de trabajo/estudio. **(Responsable: Shirley - feature/crud-equipos)**"
  - name: Notas
    description: "Registro y operaciones CRUD para Notas. **(Responsable: F - feature/crud-notas)**"
  - name: Materiales
    description: "Operaciones CRUD para Materiales de clase. **(Responsable: Sophia - feature/crud-materiales)**"
  - name: Asistencia QR
    description: "Generación y escaneo de QR para asistencias. **(Responsable: Joel - feature/asistencia-qr)**"
  - name: Mail Service
    description: "Servicio de mensajería y notificaciones. **(Responsable: E - feature/mail-service)**"
  - name: Log de Actividad
    description: "Auditoría y registros de actividad del sistema. **(Responsable: E - feature/log-actividad)**"
  - name: Dashboard
    description: "Estadísticas y métricas para el dashboard. **(Responsable: Rafael - feature/dashboard-stats)**"
  - name: Reportes PDF
    description: "Generación y descarga de reportes en PDF. **(Responsable: F - feature/pdf-reportes)**"

paths:
  # =========================================================
  # AUTH & SESIONES (Joel)
  # =========================================================
  /auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciales inválidas

  /auth/register:
    post:
      tags:
        - Autenticación
      summary: Registrar nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        
  /auth/sesiones:
    get:
      tags:
        - Sesiones
      summary: Obtener sesiones activas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de sesiones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sesion'

  /auth/sesiones/{id}:
    delete:
      tags:
        - Sesiones
      summary: Cerrar una sesión específica
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sesión terminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # =========================================================
  # CRUD ALUMNOS (Rafael)
  # =========================================================
  /alumnos:
    get:
      tags:
        - Alumnos
      summary: Listar alumnos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de alumnos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alumno'
    post:
      tags:
        - Alumnos
      summary: Crear alumno
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlumnoInput'
      responses:
        '201':
          description: Alumno creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alumno'

  /alumnos/{id}:
    get:
      tags:
        - Alumnos
      summary: Obtener alumno por ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalles del alumno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alumno'
    put:
      tags:
        - Alumnos
      summary: Actualizar alumno
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlumnoInput'
      responses:
        '200':
          description: Alumno actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alumno'
    delete:
      tags:
        - Alumnos
      summary: Eliminar alumno
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Alumno eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # =========================================================
  # CRUD DOCENTES (Sophia)
  # =========================================================
  /docentes:
    get:
      tags:
        - Docentes
      summary: Listar docentes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de docentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Docente'
    post:
      tags:
        - Docentes
      summary: Crear docente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocenteInput'
      responses:
        '201':
          description: Docente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Docente'

  /docentes/{id}:
    get:
      tags:
        - Docentes
      summary: Obtener docente por ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalles del docente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Docente'
    put:
      tags:
        - Docentes
      summary: Actualizar docente
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocenteInput'
      responses:
        '200':
          description: Docente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Docente'
    delete:
      tags:
        - Docentes
      summary: Eliminar docente
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Docente eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # =========================================================
  # CRUD CURSOS (Shirley)
  # =========================================================
  /cursos:
    get:
      tags:
        - Cursos
      summary: Listar cursos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de cursos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Curso'
    post:
      tags:
        - Cursos
      summary: Crear curso
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoInput'
      responses:
        '201':
          description: Curso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'

  /cursos/{id}:
    get:
      tags:
        - Cursos
      summary: Obtener curso por ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalles del curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
    put:
      tags:
        - Cursos
      summary: Actualizar curso
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoInput'
      responses:
        '200':
          description: Curso actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
    delete:
      tags:
        - Cursos
      summary: Eliminar curso
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Curso eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # =========================================================
  # CRUD EVALUACIONES (B)
  # =========================================================
  /evaluaciones:
    get:
      tags:
        - Evaluaciones
      summary: Listar evaluaciones
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de evaluaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evaluacion'
    post:
      tags:
        - Evaluaciones
      summary: Programar nueva evaluación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluacionInput'
      responses:
        '201':
          description: Evaluación creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluacion'

  /evaluaciones/{id}:
    get:
      tags:
        - Evaluaciones
      summary: Detalle de evaluación
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalle devuelto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluacion'
    put:
      tags:
        - Evaluaciones
      summary: Modificar evaluación
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluacionInput'
      responses:
        '200':
          description: Modificado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluacion'
    delete:
      tags:
        - Evaluaciones
      summary: Cancelar evaluación
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # =========================================================
  # CRUD TIPOS EVALUACION (B)
  # =========================================================
  /tipos-evaluacion:
    get:
      tags:
        - Tipos Evaluación
      summary: Listar tipos de evaluación (Examen, Práctica, Taller, etc.)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista devuelta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TipoEvaluacion'
    post:
      tags:
        - Tipos Evaluación
      summary: Crear tipo de evaluación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TipoEvaluacionInput'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipoEvaluacion'

  # =========================================================
  # CRUD EQUIPOS (Shirley)
  # =========================================================
  /equipos:
    get:
      tags:
        - Equipos
      summary: Listar equipos de trabajo
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de equipos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Equipo'
    post:
      tags:
        - Equipos
      summary: Crear equipo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipoInput'
      responses:
        '201':
          description: Equipo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipo'

  /equipos/{id}:
    get:
      tags:
        - Equipos
      summary: Obtener información del equipo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Info devuelta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipo'

  # =========================================================
  # CRUD NOTAS (F)
  # =========================================================
  /notas:
    get:
      tags:
        - Notas
      summary: Listar registro de notas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de notas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Nota'
    post:
      tags:
        - Notas
      summary: Registrar calificación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotaInput'
      responses:
        '201':
          description: Nota guardada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Nota'

  /notas/{id}:
    put:
      tags:
        - Notas
      summary: Actualizar nota
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotaInput'
      responses:
        '200':
          description: Nota modificada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Nota'

  # =========================================================
  # CRUD MATERIALES (Sophia)
  # =========================================================
  /materiales:
    get:
      tags:
        - Materiales
      summary: Listar materiales de clase
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de materiales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Material'
    post:
      tags:
        - Materiales
      summary: Subir nuevo material
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialInput'
      responses:
        '201':
          description: Material subido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'

  /materiales/{id}:
    delete:
      tags:
        - Materiales
      summary: Eliminar material
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Eliminado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # =========================================================
  # ASISTENCIA QR (Joel)
  # =========================================================
  /asistencia/qr/generar:
    post:
      tags:
        - Asistencia QR
      summary: Generar código QR para una clase
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRGenerarInput'
      responses:
        '200':
          description: Devuelve URL/Base64 del QR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRGenerarResponse'

  /asistencia/qr/escanear:
    post:
      tags:
        - Asistencia QR
      summary: Registrar asistencia escaneando QR
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QREscanearInput'
      responses:
        '200':
          description: Asistencia registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # =========================================================
  # MAIL SERVICE (E)
  # =========================================================
  /mail/enviar:
    post:
      tags:
        - Mail Service
      summary: Enviar correo electrónico
      description: Endpoint interno para mandar notificaciones por mail.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailInput'
      responses:
        '200':
          description: Correo enviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # =========================================================
  # LOG DE ACTIVIDAD (E)
  # =========================================================
  /logs/actividad:
    get:
      tags:
        - Log de Actividad
      summary: Listar registro de auditoría y actividades
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de eventos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogActividad'

  # =========================================================
  # DASHBOARD STATS (Rafael)
  # =========================================================
  /dashboard/estadisticas:
    get:
      tags:
        - Dashboard
      summary: Obtener métricas para el dashboard principal
      description: Devuelve totales de alumnos, cursos activos, asistencias promedio, etc.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Objeto con estadísticas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadisticasDashboard'

  # =========================================================
  # PDF REPORTES (F)
  # =========================================================
  /reportes/pdf/generar:
    post:
      tags:
        - Reportes PDF
      summary: Generar un reporte en PDF (notas, asistencias, etc)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReporteInput'
      responses:
        '200':
          description: Generación iniciada o devuelve metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /reportes/pdf/{id}:
    get:
      tags:
        - Reportes PDF
      summary: Descargar PDF generado
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Descarga de archivo
          content:
            application/pdf:
              schema:
                type: string
                format: binary

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: "Operación realizada con éxito"
        status:
          type: boolean
          example: true

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "usuario@universidad.edu"
        password:
          type: string
          example: "password123"

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - nombre
        - rol
      properties:
        nombre:
          type: string
          example: "Juan Pérez"
        email:
          type: string
          format: email
          example: "juan.perez@universidad.edu"
        password:
          type: string
          example: "password123"
        rol:
          type: string
          enum: [ALUMNO, DOCENTE, ADMIN]
          example: "ALUMNO"

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          type: object
          properties:
            id:
              type: string
              example: "60d0fe4f5311236168a109ca"
            nombre:
              type: string
              example: "Juan Pérez"
            rol:
              type: string
              example: "ALUMNO"

    Sesion:
      type: object
      properties:
        id:
          type: string
          example: "sesion_abc123"
        userId:
          type: string
          example: "60d0fe4f5311236168a109ca"
        ip:
          type: string
          example: "192.168.1.100"
        device:
          type: string
          example: "Chrome / Windows 10"
        createdAt:
          type: string
          format: date-time

    AlumnoInput:
      type: object
      required:
        - nombre
        - apellidos
        - matricula
      properties:
        nombre:
          type: string
          example: "Ana"
        apellidos:
          type: string
          example: "García"
        matricula:
          type: string
          example: "A01020304"
        fechaNacimiento:
          type: string
          format: date
          example: "2000-05-15"

    Alumno:
      allOf:
        - $ref: '#/components/schemas/AlumnoInput'
        - type: object
          properties:
            id:
              type: string
